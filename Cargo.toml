[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/hosting", "crates/gui"]

[workspace.package]
version = "1.0.0"
authors = ["Steve Chadaud"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
ramelo-core = { path = "crates/core" }
ramelo-storage = { path = "crates/storage" }
ramelo-hosting = { path = "crates/hosting" }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
