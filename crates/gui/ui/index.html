<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramelo</title>
<link rel="stylesheet" href="styles/main.css">
<script src="splash.js"></script>
</head>
<body>
<div id="splash" class="splash" role="status" aria-live="polite">
  <div class="splash-card">
    <svg class="splash-logo" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" style="fill:var(--logo-bg)"></rect><path class="l" d="M10 7.5V20.5" pathLength="1" style="stroke:var(--logo-ink)" stroke-width="1.9" stroke-linecap="round"></path><path class="l l2" d="M10 16L18.5 10.8" pathLength="1" style="stroke:var(--logo-ink)" stroke-width="1.9" stroke-linecap="round"></path><circle class="d1" cx="10" cy="7.5" r="2.6" fill="#3B6BF0"></circle><circle class="d2" cx="18.5" cy="10.8" r="2.6" fill="#1FB59A"></circle><circle class="d3" cx="10" cy="20.5" r="2.6" fill="#F0A04B"></circle></svg>
    <h1 class="splash-title">Ramelo</h1>
    <p class="splash-tag"><span lang="fr">Tous tes dépôts, sans friction.</span><span lang="en">All your repositories, without friction.</span></p>
    <div class="splash-bar" aria-hidden="true"><span id="splash-fill"></span></div>
    <div class="splash-status" id="splash-status">&nbsp;</div>
  </div>
  <div class="splash-ver">v0.1.0</div>
</div>
<script src="splash-show.js"></script>
<div id="app">
  <nav class="menubar" id="menubar" aria-label="Menu"></nav>
  <div class="tabbar" id="tabbar" role="tablist" aria-label="Repositories"></div>
  <main class="workspace" id="view-host"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
